openapi: 3.1.0
info:
  title: Conchbase Runtime API
  version: 0.9.0
  description: Local, versioned API for Conchbase Agent profiles and revisions, provider-neutral model references, pinned tasks, bounded composition execution, ordered progress events, versioned runtime configuration, durable tool request/approval records without execution, and deterministic durable work contracts without execution. Runtime capabilities include agents, provider-neutral-model-catalog, tool-approval-ledger, provider-tool-call-observation records, and durable-work-contract.
servers:
  - url: http://127.0.0.1:4318
    description: Local runtime default; loopback only.
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Check whether the local runtime process responds.
      responses:
        '200':
          description: Runtime process is responding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/runtime:
    get:
      operationId: getRuntimeStatus
      summary: Read runtime identity and currently advertised capabilities.
      responses:
        '200':
          description: Runtime status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
  /v1/models:
    get:
      operationId: listModels
      summary: List chat model ids exposed by the configured local Magpie gateway.
      responses:
        '200':
          description: Available models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '502':
          description: Model catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/model-catalog:
    get:
      operationId: listProviderModels
      summary: List available models using provider-neutral identities.
      responses:
        '200':
          description: Available provider/model references.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderModelList'
        '502':
          description: A provider model catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/agents:
    get:
      operationId: listAgents
      summary: List runtime-local Agents and their current revisions.
      responses:
        '200':
          description: Agent collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
    post:
      operationId: createAgent
      summary: Create an Agent with its initial immutable revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProfile'
      responses:
        '201':
          description: Agent created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnvelope'
        '400':
          description: Invalid profile or unavailable provider/model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/agents/{agentId}:
    get:
      operationId: getAgent
      summary: Read an Agent and its immutable revisions.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Agent detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnvelope'
        '404':
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateAgent
      summary: Append a new Agent revision if the expected revision is current.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Updated Agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnvelope'
        '409':
          description: Archived Agent or stale expected revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/agents/{agentId}/duplicate:
    post:
      operationId: duplicateAgent
      summary: Create a new Agent from the selected immutable revision.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateAgentRequest'
      responses:
        '201':
          description: Duplicated Agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnvelope'
  /v1/agents/{agentId}/archive:
    post:
      operationId: archiveAgent
      summary: Soft archive an Agent and preserve its revisions and tasks.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Archived Agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRecordEnvelope'
  /v1/agents/{agentId}/revisions:
    get:
      operationId: listAgentRevisions
      summary: List immutable revisions for one Agent.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Agent revision history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRevisionList'
  /v1/agents/{agentId}/revisions/apply:
    post:
      operationId: applyAgentRevision
      summary: Append a new current revision using historical revision content.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyAgentRevisionRequest'
      responses:
        '200':
          description: Agent with appended rollback revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnvelope'
        '409':
          description: Stale expected revision or archived Agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/agents/default:
    get:
      operationId: getDefaultAgent
      summary: Read the default Agent, if configured.
      responses:
        '200':
          description: Current default Agent or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultAgentEnvelope'
    put:
      operationId: setDefaultAgent
      summary: Set or clear the default Agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDefaultAgentRequest'
      responses:
        '200':
          description: New default Agent or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultAgentEnvelope'
  /v1/tasks:
    get:
      operationId: listTasks
      summary: List persisted tasks and the active configuration revision.
      responses:
        '200':
          description: Persisted tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
    post:
      operationId: createTask
      summary: Create and start one bounded model task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '202':
          description: Task accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tasks/{taskId}:
    get:
      operationId: getTask
      summary: Read one persisted task.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tasks/{taskId}/cancel:
    post:
      operationId: cancelTask
      summary: Request cancellation of an active task.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Task is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tasks/{taskId}/retry:
    post:
      operationId: retryTask
      summary: Start a new attempt for a terminal task from its original prompt.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: New attempt started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryTaskResponse'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Task is not in a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/events:
    get:
      operationId: listEvents
      summary: Read globally ordered persisted events after an optional event ID cursor.
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: '^evt_[0-9]{12}$'
      responses:
        '200':
          description: Events strictly after the cursor and the resulting cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          description: Invalid or unknown event cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/configuration:
    get:
      operationId: getActiveConfiguration
      summary: Read the active immutable configuration revision and document.
      responses:
        '200':
          description: Active configuration revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationEnvelope'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/configuration/revisions:
    get:
      operationId: listConfigurationRevisions
      summary: List immutable configuration revision summaries, newest first.
      responses:
        '200':
          description: Configuration history and active revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationRevisionList'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/configuration/revisions/{revisionId}:
    get:
      operationId: getConfigurationRevision
      summary: Read one immutable configuration revision document.
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Configuration revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationEnvelope'
        '404':
          description: Configuration revision not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/configuration/validate:
    post:
      operationId: validateConfiguration
      summary: Validate a configuration document without changing runtime state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateConfigurationRequest'
      responses:
        '200':
          description: Document is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateConfigurationResponse'
        '400':
          description: Invalid document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/configuration/apply:
    post:
      operationId: applyConfiguration
      summary: Apply a complete document or roll back to a known revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyConfigurationRequest'
      responses:
        '200':
          description: Configuration state after the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyConfigurationResponse'
        '400':
          description: Invalid document or request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Rollback revision not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tool-requests:
    post:
      operationId: createToolRequest
      summary: Create a normalized tool request ledger record for a v2 task attempt. No tool is executed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateToolRequest'
      responses:
        '201':
          description: Tool request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateToolRequestResponse'
        '200':
          description: Identical tool request already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateToolRequestResponse'
        '400':
          description: Invalid tool request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Tool request task context is not eligible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tool-requests/{requestId}:
    get:
      operationId: getToolRequest
      summary: Read one durable tool request ledger record.
      parameters:
        - $ref: '#/components/parameters/ToolRequestId'
      responses:
        '200':
          description: Tool request record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolRequestEnvelope'
        '404':
          description: Tool request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tool-requests/{requestId}/approval:
    post:
      operationId: decideToolRequest
      summary: Record one explicit approval or rejection. No tool is executed.
      parameters:
        - $ref: '#/components/parameters/ToolRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolRequestDecisionRequest'
      responses:
        '201':
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolRequestDecisionResponse'
        '200':
          description: Identical decision already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolRequestDecisionResponse'
        '400':
          description: Invalid decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Tool request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Tool request already has a different decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/provider-observations/tool-calls:
    post:
      operationId: observeProviderToolCall
      summary: Normalize one bounded provider tool-call payload into a transient observation.
      description: >-
        Parses one OpenAI Chat Completions-compatible non-streaming function tool call without
        persisting it, creating a ledger request, selecting a composition node, or executing a tool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderToolCallObservation'
      responses:
        '200':
          description: Transient observation, or null when the accepted provider shape has no tool call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderToolCallObservationResponse'
        '400':
          description: Invalid observation request or unsupported provider tool-call shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /v1/work/triggers:
    post:
      operationId: ingestWorkTrigger
      summary: Ingest one deterministic Source Trigger idempotently.
      description: >-
        Creates one durable WorkItem, immutable Mandate, planned Assignment, pending Outbox record,
        observed DeliveryReceipt, and bounded evidence events. It calls no model, executes no tool,
        sends no external write, and resolves no secret. A later Trigger on the same Thread adds
        context only and cannot widen the Mandate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkTriggerRequest'
      responses:
        '201':
          description: A new Trigger was ingested; workItemCreated reports whether it created the first WorkItem for the Thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkEnvelope'
        '200':
          description: An exact Trigger replay was returned without creating rows or events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkEnvelope'
        '400':
          description: Invalid JSON, unknown field, bounded Trigger, digest, Mandate, model, or topology-neutral input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Trigger id conflict or a context event that would change an existing Mandate or Assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/work/items:
    get:
      operationId: listWorkItems
      summary: List durable WorkItems and their current state.
      responses:
        '200':
          description: Durable WorkItem collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemList'
        '503':
          description: Work store is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/work/items/{workItemId}:
    get:
      operationId: getWorkItem
      summary: Read one WorkItem with Mandate, Thread, Assignments, Outbox, and DeliveryReceipt evidence.
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
      responses:
        '200':
          description: Durable WorkItem detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemDetail'
        '404':
          description: WorkItem not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Work store is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/work/delivery-receipts:
    get:
      operationId: listWorkDeliveryReceipts
      summary: List digest-only delivery evidence across durable WorkItems.
      responses:
        '200':
          description: Delivery receipt collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkDeliveryReceiptList'
        '503':
          description: Work store is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        pattern: '^agt_[a-f0-9]{32}$'
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^cfg_[0-9a-f]{24}$'
    ToolRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        pattern: '^tqr_[0-9a-f]{24}$'
    WorkItemId:
      name: workItemId
      in: path
      required: true
      schema:
        type: string
        pattern: '^work_[0-9a-f]{24}$'
    AgentReference:
      type: object
      additionalProperties: false
      required: [providerId, modelId]
      properties:
        providerId:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,63}$'
        modelId:
          type: string
          minLength: 1
          maxLength: 300
    AgentProfile:
      type: object
      additionalProperties: false
      required: [name, instructions, providerId, modelId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        instructions:
          type: string
          maxLength: 20000
          description: Untrusted customization context; never grants tools or permissions.
        providerId:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,63}$'
        modelId:
          type: string
          minLength: 1
          maxLength: 300
    AgentRevision:
      type: object
      additionalProperties: false
      required: [id, name, instructions, providerId, modelId, createdAt]
      properties:
        id:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
        name:
          type: string
          minLength: 1
          maxLength: 120
        instructions:
          type: string
          maxLength: 20000
          description: Untrusted customization context; never grants tools or permissions.
        providerId:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,63}$'
        modelId:
          type: string
          minLength: 1
          maxLength: 300
        createdAt:
          type: string
          format: date-time
    AgentRecord:
      type: object
      additionalProperties: false
      required: [id, currentRevisionId, archived, isDefault, current]
      properties:
        id:
          type: string
          pattern: '^agt_[a-f0-9]{32}$'
        currentRevisionId:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
        archived:
          type: boolean
        isDefault:
          type: boolean
        current:
          $ref: '#/components/schemas/AgentRevision'
    Agent:
      type: object
      additionalProperties: false
      required: [id, currentRevisionId, archived, isDefault, current, revisions]
      properties:
        id:
          type: string
          pattern: '^agt_[a-f0-9]{32}$'
        currentRevisionId:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
        archived:
          type: boolean
        isDefault:
          type: boolean
        current:
          $ref: '#/components/schemas/AgentRevision'
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/AgentRevision'
    AgentEnvelope:
      type: object
      additionalProperties: false
      required: [agent]
      properties:
        agent:
          $ref: '#/components/schemas/Agent'
    AgentRecordEnvelope:
      type: object
      additionalProperties: false
      required: [agent]
      properties:
        agent:
          $ref: '#/components/schemas/AgentRecord'
    AgentList:
      type: object
      additionalProperties: false
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentRecord'
    AgentRevisionList:
      type: object
      additionalProperties: false
      required: [agentId, revisions]
      properties:
        agentId:
          type: string
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/AgentRevision'
    AgentProfileEnvelope:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile:
          $ref: '#/components/schemas/AgentProfile'
    UpdateAgentRequest:
      type: object
      additionalProperties: false
      required: [expectedRevisionId, profile]
      properties:
        expectedRevisionId:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
        profile:
          $ref: '#/components/schemas/AgentProfile'
    DuplicateAgentRequest:
      type: object
      additionalProperties: false
      properties:
        revisionId:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
        profile:
          $ref: '#/components/schemas/AgentProfile'
    ApplyAgentRevisionRequest:
      type: object
      additionalProperties: false
      required: [revisionId, expectedRevisionId]
      properties:
        revisionId:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
        expectedRevisionId:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
    SetDefaultAgentRequest:
      type: object
      additionalProperties: false
      required: [agentId]
      properties:
        agentId:
          type: [string, 'null']
    DefaultAgentEnvelope:
      type: object
      additionalProperties: false
      required: [agent]
      properties:
        agent:
          oneOf:
            - $ref: '#/components/schemas/AgentRecord'
            - type: 'null'
    ProviderModel:
      type: object
      additionalProperties: false
      required: [providerId, modelId, reference, displayName, capabilities]
      properties:
        providerId:
          type: string
        modelId:
          type: string
        reference:
          type: string
        displayName:
          type: string
        capabilities:
          type: array
          items:
            type: string
    ProviderModelList:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ProviderModel'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, apiVersion]
      properties:
        status:
          const: ok
        service:
          const: conchbase
        apiVersion:
          const: 1
    RuntimeStatus:
      type: object
      additionalProperties: false
      required: [name, version, state, capabilities]
      properties:
        name:
          const: Conchbase
        version:
          type: string
        state:
          const: ready
        capabilities:
          type: array
          description: Runtime features currently available, including agents and provider-neutral-model-catalog when task services are enabled.
          items:
            type: string
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    ValidationError:
      type: object
      additionalProperties: false
      required: [error, details]
      properties:
        error:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [path, reason]
      properties:
        path:
          type: string
        reason:
          type: string
    ConfigurationSource:
      type: string
      enum: [inline, file, registry, env]
    ConfigurationReference:
      type: object
      additionalProperties: false
      required: [id, label, source]
      properties:
        id:
          type: string
          maxLength: 128
        label:
          type: string
          maxLength: 200
        source:
          $ref: '#/components/schemas/ConfigurationSource'
    ConfigurationReferenceList:
      type: array
      maxItems: 32
      items:
        $ref: '#/components/schemas/ConfigurationReference'
    ConfigurationDocument:
      oneOf:
        - $ref: '#/components/schemas/ConfigurationDocumentV1'
        - $ref: '#/components/schemas/ConfigurationDocumentV2'
    ConfigurationDocumentV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, name, skills, policies, mcpServers, plugins, secretRefs, metadata]
      properties:
        schemaVersion:
          const: 1
        name:
          $ref: '#/components/schemas/BoundedConfigurationName'
        skills:
          $ref: '#/components/schemas/ConfigurationReferenceList'
        policies:
          $ref: '#/components/schemas/ConfigurationReferenceList'
        mcpServers:
          $ref: '#/components/schemas/ConfigurationReferenceList'
        plugins:
          $ref: '#/components/schemas/ConfigurationReferenceList'
        secretRefs:
          $ref: '#/components/schemas/ConfigurationSecretRefs'
        metadata:
          $ref: '#/components/schemas/ConfigurationMetadata'
    ConfigurationDocumentV2:
      type: object
      additionalProperties: false
      required: [schemaVersion, name, skills, policies, mcpServers, plugins, secretRefs, metadata, composition]
      properties:
        schemaVersion:
          const: 2
        name:
          $ref: '#/components/schemas/BoundedConfigurationName'
        skills:
          $ref: '#/components/schemas/ConfigurationReferenceList'
        policies:
          $ref: '#/components/schemas/ConfigurationReferenceList'
        mcpServers:
          $ref: '#/components/schemas/ConfigurationReferenceList'
        plugins:
          $ref: '#/components/schemas/ConfigurationReferenceList'
        secretRefs:
          $ref: '#/components/schemas/ConfigurationSecretRefs'
        metadata:
          $ref: '#/components/schemas/ConfigurationMetadata'
        composition:
          $ref: '#/components/schemas/ConfigurationComposition'
    BoundedConfigurationName:
      type: string
      minLength: 1
      maxLength: 120
    ConfigurationSecretRefs:
      type: array
      maxItems: 32
      items:
        type: string
        maxLength: 200
    ConfigurationMetadata:
      type: object
      maxProperties: 32
      additionalProperties:
        type: string
        maxLength: 500
    ConfigurationComposition:
      type: object
      additionalProperties: false
      required: [schemaVersion, name, nodes, links, entryNodeIds, metadata]
      properties:
        schemaVersion:
          const: 1
        name:
          $ref: '#/components/schemas/BoundedConfigurationName'
        nodes:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/CompositionNode'
        links:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/CompositionLink'
        entryNodeIds:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/CompositionNodeId'
        metadata:
          $ref: '#/components/schemas/ConfigurationMetadata'
    CompositionNode:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          $ref: '#/components/schemas/CompositionNodeId'
        label:
          type: string
          minLength: 1
          maxLength: 200
    CompositionLink:
      type: object
      additionalProperties: false
      required: [id, from, to, label]
      properties:
        id:
          $ref: '#/components/schemas/CompositionNodeId'
        from:
          $ref: '#/components/schemas/CompositionNodeId'
        to:
          $ref: '#/components/schemas/CompositionNodeId'
        label:
          type: string
          minLength: 1
          maxLength: 200
    CompositionNodeId:
      type: string
      minLength: 1
      maxLength: 128
    ConfigurationRevision:
      type: object
      additionalProperties: false
      required: [id, document, appliedAt]
      properties:
        id:
          type: string
          pattern: '^cfg_[0-9a-f]{24}$'
        document:
          $ref: '#/components/schemas/ConfigurationDocument'
        appliedAt:
          type: string
          format: date-time
    ConfigurationRevisionSummary:
      type: object
      additionalProperties: false
      required: [id, name, appliedAt]
      properties:
        id:
          type: string
        name:
          type: string
        appliedAt:
          type: string
          format: date-time
    ConfigurationEnvelope:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          $ref: '#/components/schemas/ConfigurationRevision'
    ConfigurationRevisionList:
      type: object
      additionalProperties: false
      required: [activeRevisionId, revisions]
      properties:
        activeRevisionId:
          type: string
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationRevisionSummary'
    ValidateConfigurationRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document:
          $ref: '#/components/schemas/ConfigurationDocument'
    ValidateConfigurationResponse:
      type: object
      additionalProperties: false
      required: [valid, activeRevisionId, document]
      properties:
        valid:
          const: true
        activeRevisionId:
          type: string
        document:
          $ref: '#/components/schemas/ConfigurationDocument'
    ApplyConfigurationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      oneOf:
        - required: [document]
          not:
            required: [rollbackTo]
        - required: [rollbackTo]
          not:
            required: [document]
      properties:
        document:
          $ref: '#/components/schemas/ConfigurationDocument'
        rollbackTo:
          type: string
          pattern: '^cfg_[0-9a-f]{24}$'
    ApplyConfigurationResponse:
      type: object
      additionalProperties: false
      required: [changed, activeRevisionId, revision, revisions]
      properties:
        changed:
          type: boolean
        activeRevisionId:
          type: string
        revision:
          $ref: '#/components/schemas/ConfigurationRevision'
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationRevisionSummary'
    TaskState:
      type: string
      enum: [queued, running, cancelling, succeeded, failed, cancelled, interrupted, waiting_approval]
    Task:
      type: object
      additionalProperties: false
      required: [id, prompt, model, configurationRevisionId, state, attempt, output, partialOutput, error]
      properties:
        id:
          type: string
        prompt:
          type: string
        model:
          type: string
        configurationRevisionId:
          type: string
        state:
          $ref: '#/components/schemas/TaskState'
        attempt:
          type: integer
          minimum: 1
        output:
          type: [string, 'null']
        partialOutput:
          type: [string, 'null']
        error:
          type: [string, 'null']
        agentId:
          type: string
          pattern: '^agt_[a-f0-9]{32}$'
        agentRevisionId:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
        providerId:
          type: string
        modelId:
          type: string
    TaskEnvelope:
      type: object
      additionalProperties: false
      required: [task]
      properties:
        task:
          $ref: '#/components/schemas/Task'
    TaskList:
      type: object
      additionalProperties: false
      required: [tasks, activeConfigurationRevisionId]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        activeConfigurationRevisionId:
          type: string
    RetryTaskResponse:
      type: object
      additionalProperties: false
      required: [task, retried]
      properties:
        task:
          $ref: '#/components/schemas/Task'
        retried:
          const: true
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
        model:
          type: string
          minLength: 1
          maxLength: 300
        agentId:
          type: string
          pattern: '^agt_[a-f0-9]{32}$'
        modelOverride:
          $ref: '#/components/schemas/AgentReference'
      allOf:
        - not:
            required: [agentId, model]
        - if:
            required: [agentId]
          then: {}
          else:
            not:
              required: [modelOverride]
    RuntimeEvent:
      type: object
      additionalProperties: false
      required: [sequence, id, taskId, type, state, configurationRevisionId, attempt, data]
      properties:
        sequence:
          type: integer
          minimum: 1
        id:
          type: string
        taskId:
          type: string
        type:
          type: string
          enum:
            - task.queued
            - task.started
            - task.output_delta
            - task.approval_requested
            - task.approved
            - task.completed
            - task.failed
            - task.cancellation_requested
            - task.cancelled
            - task.interrupted
            - composition.started
            - composition.node_started
            - composition.node_completed
            - composition.node_cancelled
            - composition.completed
            - composition.cancelled
            - tool.requested
            - tool.approval_required
            - tool.approved
            - tool.rejected
        state:
          $ref: '#/components/schemas/TaskState'
        configurationRevisionId:
          type: string
        attempt:
          type: integer
          minimum: 1
        data:
          type: object
          description: >-
            Bounded scalar event data. Composition events carry compositionDocumentId,
            compositionNodeId, nodeIndex, nodeCount, completedNodeCount, and terminalNodeIds
            as documented by ADR 0016. Public tool ledger events carry toolRequestId,
            configurationRevisionId, attempt, compositionDocumentId, compositionNodeId,
            toolName, argumentsDigest, idempotencyKey, status, and decision-only decision,
            approvalId, and reasonDigest fields as documented by ADR 0017. Execution,
            replay, denial, and failure vocabulary is not part of the public event contract.
          additionalProperties:
            type: [string, number, boolean, 'null']
        agentId:
          type: string
          pattern: '^agt_[a-f0-9]{32}$'
        agentRevisionId:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
        providerId:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,63}$'
        modelId:
          type: string
          minLength: 1
          maxLength: 300
    EventList:
      type: object
      additionalProperties: false
      required: [events, cursor]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeEvent'
        cursor:
          type: [string, 'null']
    ModelCatalogEntry:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
        displayName:
          type: string
    ModelList:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelCatalogEntry'
    ToolCallProposal:
      type: object
      additionalProperties: false
      required: [toolName, arguments]
      properties:
        toolName:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        arguments:
          type: object
          maxProperties: 8
          additionalProperties:
            type: [string, number, boolean, 'null']
    ProviderToolCallObservation:
      type: object
      additionalProperties: false
      required: [version, kind, provider, providerToolCallId, toolCall, argumentsDigest]
      properties:
        version:
          const: 1
        kind:
          const: tool_call
        provider:
          const: openai-chat-completions
        providerToolCallId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-zA-Z0-9_-]+$'
        toolCall:
          $ref: '#/components/schemas/ToolCallProposal'
        argumentsDigest:
          type: string
          pattern: '^arg_[0-9a-f]{24}$'
    CreateProviderToolCallObservation:
      type: object
      additionalProperties: false
      required: [version, provider, payload]
      properties:
        version:
          const: 1
        provider:
          const: openai-chat-completions
        payload:
          type: object
          minProperties: 1
          maxProperties: 8
          description: >-
            One bounded plain-JSON provider response shape. Raw provider envelope fields,
            secrets, absolute URLs, streaming deltas, and task/ledger identity are not accepted.
          additionalProperties: true
    ProviderToolCallObservationResponse:
      type: object
      additionalProperties: false
      required: [observation]
      properties:
        observation:
          oneOf:
            - $ref: '#/components/schemas/ProviderToolCallObservation'
            - type: 'null'
    CreateToolRequest:
      type: object
      additionalProperties: false
      required: [taskId, attempt, compositionNodeId, toolCall]
      properties:
        taskId:
          type: string
          minLength: 1
          maxLength: 200
        attempt:
          type: integer
          minimum: 1
        compositionNodeId:
          type: string
          minLength: 1
          maxLength: 128
        toolCall:
          $ref: '#/components/schemas/ToolCallProposal'
    ToolRequestStatus:
      type: string
      enum: [pending, approved, rejected]
    ToolRequestDecision:
      type: string
      enum: [approved, rejected]
    ToolRequestApproval:
      type: object
      additionalProperties: false
      required: [id, decision, reasonDigest, decidedAt]
      properties:
        id:
          type: string
          pattern: '^tap_[0-9a-f]{24}$'
        decision:
          $ref: '#/components/schemas/ToolRequestDecision'
        reasonDigest:
          type: string
          pattern: '^rsn_[0-9a-f]{24}$'
        decidedAt:
          type: string
          format: date-time
    ToolRequest:
      type: object
      additionalProperties: false
      required: [version, id, taskId, attempt, configurationRevisionId, compositionDocumentId, compositionNodeId, toolName, argumentsDigest, idempotencyKey, status, createdAt, approval]
      properties:
        version:
          const: 1
        id:
          type: string
          pattern: '^tqr_[0-9a-f]{24}$'
        taskId:
          type: string
        attempt:
          type: integer
          minimum: 1
        configurationRevisionId:
          type: string
          pattern: '^cfg_[0-9a-f]{24}$'
        compositionDocumentId:
          type: string
          pattern: '^cmp_[0-9a-f]{24}$'
        compositionNodeId:
          type: string
        toolName:
          type: string
        argumentsDigest:
          type: string
          pattern: '^arg_[0-9a-f]{24}$'
        idempotencyKey:
          type: string
          pattern: '^idem_[0-9a-f]{24}$'
        status:
          $ref: '#/components/schemas/ToolRequestStatus'
        createdAt:
          type: string
          format: date-time
        approval:
          oneOf:
            - $ref: '#/components/schemas/ToolRequestApproval'
            - type: 'null'
    ToolRequestEnvelope:
      type: object
      additionalProperties: false
      required: [request]
      properties:
        request:
          $ref: '#/components/schemas/ToolRequest'
    CreateToolRequestResponse:
      type: object
      additionalProperties: false
      required: [request, created]
      properties:
        request:
          $ref: '#/components/schemas/ToolRequest'
        created:
          type: boolean
    ToolRequestDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision:
          $ref: '#/components/schemas/ToolRequestDecision'
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ToolRequestDecisionResponse:
      type: object
      additionalProperties: false
      required: [request, changed]
      properties:
        request:
          $ref: '#/components/schemas/ToolRequest'
        changed:
          type: boolean
    WorkDigest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    WorkSource:
      type: object
      additionalProperties: false
      required: [sourceId, kind]
      properties:
        sourceId:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          type: string
          enum: [manual, fake]
    WorkTriggerInput:
      type: object
      additionalProperties: false
      required: [triggerId, threadKey, payloadDigest, occurredAt]
      properties:
        triggerId:
          type: string
          minLength: 1
          maxLength: 120
        threadKey:
          type: string
          minLength: 1
          maxLength: 120
        payloadDigest:
          $ref: '#/components/schemas/WorkDigest'
        occurredAt:
          type: string
          format: date-time
          maxLength: 40
    WorkMandateInput:
      type: object
      additionalProperties: false
      required: [scope, allowedOperations, capabilitiesDigest]
      properties:
        scope:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 80
        allowedOperations:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 80
        capabilitiesDigest:
          $ref: '#/components/schemas/WorkDigest'
    WorkModelReference:
      type: object
      additionalProperties: false
      required: [providerId, modelId]
      properties:
        providerId:
          type: string
          minLength: 1
          maxLength: 80
        modelId:
          type: string
          minLength: 1
          maxLength: 120
    CreateWorkTriggerRequest:
      type: object
      additionalProperties: false
      required: [source, trigger, mandate, model, agentRevisionId, configurationRevisionId]
      properties:
        source:
          $ref: '#/components/schemas/WorkSource'
        trigger:
          $ref: '#/components/schemas/WorkTriggerInput'
        mandate:
          $ref: '#/components/schemas/WorkMandateInput'
        model:
          $ref: '#/components/schemas/WorkModelReference'
        agentRevisionId:
          type: string
          minLength: 1
          maxLength: 120
        configurationRevisionId:
          type: string
          minLength: 1
          maxLength: 120
    WorkTrigger:
      type: object
      additionalProperties: false
      required: [version, id, sourceEventId, sourceId, sourceKind, threadKey, threadId, payloadDigest, occurredAt, canonicalDigest, proposalDigest]
      properties:
        version:
          const: 1
        id:
          type: string
          pattern: '^trg_[0-9a-f]{24}$'
        sourceEventId:
          type: string
        sourceId:
          type: string
        sourceKind:
          type: string
          enum: [manual, fake]
        threadKey:
          type: string
        threadId:
          type: string
          pattern: '^thr_[0-9a-f]{24}$'
        payloadDigest:
          $ref: '#/components/schemas/WorkDigest'
        occurredAt:
          type: string
          format: date-time
        canonicalDigest:
          $ref: '#/components/schemas/WorkDigest'
        proposalDigest:
          $ref: '#/components/schemas/WorkDigest'
    WorkThread:
      type: object
      additionalProperties: false
      required: [version, id, threadKey, contextOnly, triggerIds, workItemId]
      properties:
        version:
          const: 1
        id:
          type: string
          pattern: '^thr_[0-9a-f]{24}$'
        threadKey:
          type: string
        contextOnly:
          const: true
        triggerIds:
          type: array
          items:
            type: string
            pattern: '^trg_[0-9a-f]{24}$'
        workItemId:
          type: string
          pattern: '^work_[0-9a-f]{24}$'
    WorkMandate:
      type: object
      additionalProperties: false
      required: [version, id, workItemId, revision, scope, allowedOperations, capabilitiesDigest]
      properties:
        version:
          const: 1
        id:
          type: string
          pattern: '^man_[0-9a-f]{24}$'
        workItemId:
          type: string
          pattern: '^work_[0-9a-f]{24}$'
        revision:
          const: 1
        scope:
          type: array
          items:
            type: string
        allowedOperations:
          type: array
          items:
            type: string
        capabilitiesDigest:
          $ref: '#/components/schemas/WorkDigest'
    WorkItem:
      type: object
      additionalProperties: false
      required: [version, id, state, threadId, triggerId, mandateId, mandateRevision]
      properties:
        version:
          const: 1
        id:
          type: string
          pattern: '^work_[0-9a-f]{24}$'
        state:
          const: open
        threadId:
          type: string
          pattern: '^thr_[0-9a-f]{24}$'
        triggerId:
          type: string
          pattern: '^trg_[0-9a-f]{24}$'
        mandateId:
          type: string
          pattern: '^man_[0-9a-f]{24}$'
        mandateRevision:
          const: 1
    WorkAssignment:
      type: object
      additionalProperties: false
      required: [version, id, workItemId, state, agentRevisionId, configurationRevisionId, mandateRevision, model]
      properties:
        version:
          const: 1
        id:
          type: string
          pattern: '^asg_[0-9a-f]{24}$'
        workItemId:
          type: string
          pattern: '^work_[0-9a-f]{24}$'
        state:
          const: planned
        agentRevisionId:
          type: string
        configurationRevisionId:
          type: string
        mandateRevision:
          const: 1
        model:
          $ref: '#/components/schemas/WorkModelReference'
    WorkOutboxRecord:
      type: object
      additionalProperties: false
      required: [version, id, workItemId, assignmentId, status, destinationDigest, payloadDigest]
      properties:
        version:
          const: 1
        id:
          type: string
          pattern: '^obx_[0-9a-f]{24}$'
        workItemId:
          type: string
          pattern: '^work_[0-9a-f]{24}$'
        assignmentId:
          type: string
          pattern: '^asg_[0-9a-f]{24}$'
        status:
          const: pending
        destinationDigest:
          $ref: '#/components/schemas/WorkDigest'
        payloadDigest:
          $ref: '#/components/schemas/WorkDigest'
    WorkDeliveryReceipt:
      type: object
      additionalProperties: false
      required: [version, id, workItemId, outboxId, status, destinationDigest, payloadDigest]
      properties:
        version:
          const: 1
        id:
          type: string
          pattern: '^dlv_[0-9a-f]{24}$'
        workItemId:
          type: string
          pattern: '^work_[0-9a-f]{24}$'
        outboxId:
          type: string
          pattern: '^obx_[0-9a-f]{24}$'
        status:
          const: observed
        destinationDigest:
          $ref: '#/components/schemas/WorkDigest'
        payloadDigest:
          $ref: '#/components/schemas/WorkDigest'
    WorkEvent:
      type: object
      additionalProperties: false
      required: [version, id, sequence, type, workItemId, data]
      properties:
        version:
          const: 1
        id:
          type: string
          pattern: '^evt_[0-9]{12}$'
        sequence:
          type: integer
          minimum: 1
        type:
          type: string
          enum: [work.trigger_ingested, work.item_created, work.assignment_planned, work.outbox_recorded, work.delivery_observed]
        workItemId:
          type: string
          pattern: '^work_[0-9a-f]{24}$'
        data:
          type: object
          additionalProperties:
            type: [string, number, boolean]
    WorkEnvelope:
      type: object
      additionalProperties: false
      required: [version, created, workItemCreated, contextOnly, trigger, thread, mandate, workItem, assignments, outbox, deliveryReceipts, events]
      properties:
        version:
          const: 1
        created:
          type: boolean
        workItemCreated:
          type: boolean
        contextOnly:
          type: boolean
        trigger:
