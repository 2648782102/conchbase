openapi: 3.1.0
info:
  title: Conchbase Runtime API
  version: 1.1.0
  description: Local, versioned API for Conchbase Agent profiles and revisions, provider-neutral model references, pinned tasks, bounded composition execution, ordered progress events, versioned runtime configuration, durable tool request/approval records without execution, durable asynchronous work control, reviewed authenticated pairing, one local Source, a capability directory, and write-only SecretHandles with digest-only use receipts. Runtime capabilities include agents, provider-neutral-model-catalog, tool-approval-ledger, provider-tool-call-observation records, durable-work-contract, authenticated-pairing, asynchronous-work-control, local-source-policy, capability-directory, and write-only-secret-handles.
servers:
  - url: http://127.0.0.1:4318
    description: Local runtime default; loopback only.
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Check whether the local runtime process responds.
      responses:
        '200':
          description: Runtime process is responding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/runtime:
    get:
      operationId: getRuntimeStatus
      summary: Read runtime identity and currently advertised capabilities.
      responses:
        '200':
          description: Runtime status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
  /v1/models:
    get:
      operationId: listModels
      summary: List chat model ids exposed by the configured local Magpie gateway.
      responses:
        '200':
          description: Available models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '502':
          description: Model catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/model-catalog:
    get:
      operationId: listProviderModels
      summary: List available models using provider-neutral identities.
      responses:
        '200':
          description: Available provider/model references.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderModelList'
        '502':
          description: A provider model catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/agents:
    get:
      operationId: listAgents
      summary: List runtime-local Agents and their current revisions.
      responses:
        '200':
          description: Agent collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
    post:
      operationId: createAgent
      summary: Create an Agent with its initial immutable revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProfile'
      responses:
        '201':
          description: Agent created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnvelope'
        '400':
          description: Invalid profile or unavailable provider/model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/agents/{agentId}:
    get:
      operationId: getAgent
      summary: Read an Agent and its immutable revisions.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Agent detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnvelope'
        '404':
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateAgent
      summary: Append a new Agent revision if the expected revision is current.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Updated Agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnvelope'
        '409':
          description: Archived Agent or stale expected revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/agents/{agentId}/duplicate:
    post:
      operationId: duplicateAgent
      summary: Create a new Agent from the selected immutable revision.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateAgentRequest'
      responses:
        '201':
          description: Duplicated Agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnvelope'
  /v1/agents/{agentId}/archive:
    post:
      operationId: archiveAgent
      summary: Soft archive an Agent and preserve its revisions and tasks.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Archived Agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRecordEnvelope'
  /v1/agents/{agentId}/revisions:
    get:
      operationId: listAgentRevisions
      summary: List immutable revisions for one Agent.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Agent revision history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRevisionList'
  /v1/agents/{agentId}/revisions/apply:
    post:
      operationId: applyAgentRevision
      summary: Append a new current revision using historical revision content.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyAgentRevisionRequest'
      responses:
        '200':
          description: Agent with appended rollback revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnvelope'
        '409':
          description: Stale expected revision or archived Agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/agents/default:
    get:
      operationId: getDefaultAgent
      summary: Read the default Agent, if configured.
      responses:
        '200':
          description: Current default Agent or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultAgentEnvelope'
    put:
      operationId: setDefaultAgent
      summary: Set or clear the default Agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDefaultAgentRequest'
      responses:
        '200':
          description: New default Agent or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultAgentEnvelope'
  /v1/tasks:
    get:
      operationId: listTasks
      summary: List persisted tasks and the active configuration revision.
      responses:
        '200':
          description: Persisted tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
    post:
      operationId: createTask
      summary: Create and start one bounded model task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '202':
          description: Task accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tasks/{taskId}:
    get:
      operationId: getTask
      summary: Read one persisted task.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tasks/{taskId}/cancel:
    post:
      operationId: cancelTask
      summary: Request cancellation of an active task.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Task is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tasks/{taskId}/retry:
    post:
      operationId: retryTask
      summary: Start a new attempt for a terminal task from its original prompt.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: New attempt started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryTaskResponse'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Task is not in a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tasks/{taskId}/approval:
    post:
      operationId: decideTaskApproval
      summary: Approve or reject a pending write-tool approval for a task.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected]
      responses:
        '200':
          description: Decision recorded; an approval resumes the agent loop.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [task]
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
        '400':
          description: decision must be approved or rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Task is not waiting for approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/events:
    get:
      operationId: listEvents
      summary: Read globally ordered persisted events after an optional event ID cursor.
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: '^evt_[0-9]{12}$'
      responses:
        '200':
          description: Events strictly after the cursor and the resulting cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          description: Invalid or unknown event cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/configuration:
    get:
      operationId: getActiveConfiguration
      summary: Read the active immutable configuration revision and document.
      responses:
        '200':
          description: Active configuration revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationEnvelope'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/configuration/revisions:
    get:
      operationId: listConfigurationRevisions
      summary: List immutable configuration revision summaries, newest first.
      responses:
        '200':
          description: Configuration history and active revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationRevisionList'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/configuration/revisions/{revisionId}:
    get:
      operationId: getConfigurationRevision
      summary: Read one immutable configuration revision document.
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Configuration revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationEnvelope'
        '404':
          description: Configuration revision not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/configuration/validate:
    post:
      operationId: validateConfiguration
      summary: Validate a configuration document without changing runtime state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateConfigurationRequest'
      responses:
        '200':
          description: Document is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateConfigurationResponse'
        '400':
          description: Invalid document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/configuration/apply:
    post:
      operationId: applyConfiguration
      summary: Apply a complete document or roll back to a known revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyConfigurationRequest'
      responses:
        '200':
          description: Configuration state after the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyConfigurationResponse'
        '400':
          description: Invalid document or request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Rollback revision not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tool-requests:
    post:
      operationId: createToolRequest
      summary: Create a normalized tool request ledger record for a v2 task attempt. No tool is executed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateToolRequest'
      responses:
        '201':
          description: Tool request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateToolRequestResponse'
        '200':
          description: Identical tool request already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateToolRequestResponse'
        '400':
          description: Invalid tool request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Tool request task context is not eligible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tool-requests/{requestId}:
    get:
      operationId: getToolRequest
      summary: Read one durable tool request ledger record.
      parameters:
        - $ref: '#/components/parameters/ToolRequestId'
      responses:
        '200':
          description: Tool request record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolRequestEnvelope'
        '404':
          description: Tool request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tool-requests/{requestId}/approval:
    post:
      operationId: decideToolRequest
      summary: Record one explicit approval or rejection. No tool is executed.
      parameters:
        - $ref: '#/components/parameters/ToolRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolRequestDecisionRequest'
      responses:
        '201':
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolRequestDecisionResponse'
        '200':
          description: Identical decision already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolRequestDecisionResponse'
        '400':
          description: Invalid decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Tool request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Tool request already has a different decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/provider-observations/tool-calls:
    post:
      operationId: observeProviderToolCall
      summary: Normalize one bounded provider tool-call payload into a transient observation.
      description: >-
        Parses one OpenAI Chat Completions-compatible non-streaming function tool call without
        persisting it, creating a ledger request, selecting a composition node, or executing a tool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderToolCallObservation'
      responses:
        '200':
          description: Transient observation, or null when the accepted provider shape has no tool call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderToolCallObservationResponse'
        '400':
          description: Invalid observation request or unsupported provider tool-call shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /v1/work/triggers:
    post:
      operationId: ingestWorkTrigger
      summary: Ingest one deterministic Source Trigger idempotently.
      description: >-
        Creates one durable WorkItem, immutable Mandate, planned Assignment, pending Outbox record,
        observed DeliveryReceipt, and bounded evidence events. It calls no model, executes no tool,
        sends no external write, and resolves no secret. A later Trigger on the same Thread adds
        context only and cannot widen the Mandate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkTriggerRequest'
      responses:
        '201':
          description: A new Trigger was ingested; workItemCreated reports whether it created the first WorkItem for the Thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkEnvelope'
        '200':
          description: An exact Trigger replay was returned without creating rows or events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkEnvelope'
        '400':
          description: Invalid JSON, unknown field, bounded Trigger, digest, Mandate, model, or topology-neutral input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Trigger id conflict or a context event that would change an existing Mandate or Assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/work/items:
    get:
      operationId: listWorkItems
      summary: List durable WorkItems and their current state.
      responses:
        '200':
          description: Durable WorkItem collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemList'
        '503':
          description: Work store is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/work/items/{workItemId}:
    get:
      operationId: getWorkItem
      summary: Read one WorkItem with Mandate, Thread, Assignments, Outbox, and DeliveryReceipt evidence.
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
      responses:
        '200':
          description: Durable WorkItem detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemDetail'
        '404':
          description: WorkItem not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Work store is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/work/delivery-receipts:
    get:
      operationId: listWorkDeliveryReceipts
      summary: List digest-only delivery evidence across durable WorkItems.
      responses:
        '200':
          description: Delivery receipt collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkDeliveryReceiptList'
        '503':
          description: Work store is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/work/delivery-receipts/{receiptId}/decision:
    post:
      operationId: decideWorkDeliveryReceipt
      summary: Record an explicit accepted or rejected delivery decision.
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryDecisionRequest'
      responses:
        '200':
          description: Updated WorkItem snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkControlResponse'
        '400':
          $ref: '#/components/responses/PlatformValidationError'
        '404':
          $ref: '#/components/responses/PlatformNotFoundError'
        '409':
          $ref: '#/components/responses/PlatformConflictError'
        '503':
          $ref: '#/components/responses/PlatformUnavailableError'
  /v1/work/assignments/{assignmentId}/reconcile:
    post:
      operationId: reconcileWorkAssignment
      summary: Reconcile one interrupted Assignment after restart.
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      responses:
        '200':
          description: Updated WorkItem snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkControlResponse'
        '400':
          $ref: '#/components/responses/PlatformValidationError'
        '404':
          $ref: '#/components/responses/PlatformNotFoundError'
        '409':
          $ref: '#/components/responses/PlatformConflictError'
        '503':
          $ref: '#/components/responses/PlatformUnavailableError'
  /v1/work/items/{workItemId}/start:
    post:
      operationId: startWorkItem
      summary: Start or resume one durable WorkItem with expected-state concurrency.
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkControlRequest'
      responses:
        '200':
          description: Started WorkItem snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkControlResponse'
        '400':
          $ref: '#/components/responses/PlatformValidationError'
        '404':
          $ref: '#/components/responses/PlatformNotFoundError'
        '409':
          $ref: '#/components/responses/PlatformConflictError'
        '503':
          $ref: '#/components/responses/PlatformUnavailableError'
  /v1/work/items/{workItemId}/stop:
    post:
      operationId: stopWorkItem
      summary: Stop one running or paused durable WorkItem.
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkControlRequest'
      responses:
        '200':
          description: Cancelled WorkItem snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkControlResponse'
        '400':
          $ref: '#/components/responses/PlatformValidationError'
        '404':
          $ref: '#/components/responses/PlatformNotFoundError'
        '409':
          $ref: '#/components/responses/PlatformConflictError'
        '503':
          $ref: '#/components/responses/PlatformUnavailableError'
  /v1/work/items/{workItemId}/complete:
    post:
      operationId: completeWorkItem
      summary: Complete one running durable WorkItem and mark bounded delivery evidence.
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkControlRequest'
      responses:
        '200':
          description: Completed WorkItem snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkControlResponse'
        '400':
          $ref: '#/components/responses/PlatformValidationError'
        '404':
          $ref: '#/components/responses/PlatformNotFoundError'
        '409':
          $ref: '#/components/responses/PlatformConflictError'
        '503':
          $ref: '#/components/responses/PlatformUnavailableError'
  /v1/work/events:
    get:
      operationId: listWorkEvents
      summary: List bounded durable work and platform evidence events.
      responses:
        '200':
