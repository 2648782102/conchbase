    TaskState:
      type: string
      enum: [queued, running, cancelling, succeeded, failed, cancelled, interrupted, waiting_approval]
    Task:
      type: object
      additionalProperties: false
      required: [id, prompt, model, configurationRevisionId, state, attempt, output, partialOutput, error]
      properties:
        id:
          type: string
        prompt:
          type: string
        model:
          type: string
        configurationRevisionId:
          type: string
        state:
          $ref: '#/components/schemas/TaskState'
        attempt:
          type: integer
          minimum: 1
        output:
          type: [string, 'null']
        partialOutput:
          type: [string, 'null']
        error:
          type: [string, 'null']
        agentId:
          type: string
          pattern: '^agt_[a-f0-9]{32}$'
        agentRevisionId:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
        providerId:
          type: string
        modelId:
          type: string
    TaskEnvelope:
      type: object
      additionalProperties: false
      required: [task]
      properties:
        task:
          $ref: '#/components/schemas/Task'
    TaskList:
      type: object
      additionalProperties: false
      required: [tasks, activeConfigurationRevisionId]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        activeConfigurationRevisionId:
          type: string
    RetryTaskResponse:
      type: object
      additionalProperties: false
      required: [task, retried]
      properties:
        task:
          $ref: '#/components/schemas/Task'
        retried:
          const: true
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
        model:
          type: string
          minLength: 1
          maxLength: 300
        agentId:
          type: string
          pattern: '^agt_[a-f0-9]{32}$'
        modelOverride:
          $ref: '#/components/schemas/AgentReference'
      allOf:
        - not:
            required: [agentId, model]
        - if:
            required: [agentId]
          then: {}
          else:
            not:
              required: [modelOverride]
    RuntimeEvent:
      type: object
      additionalProperties: false
      required: [sequence, id, taskId, type, state, configurationRevisionId, attempt, data]
      properties:
        sequence:
          type: integer
          minimum: 1
        id:
          type: string
        taskId:
          type: string
        type:
          type: string
          enum:
            - task.queued
            - task.started
            - task.output_delta
            - task.approval_requested
            - task.approved
            - task.completed
            - task.failed
            - task.cancellation_requested
            - task.cancelled
            - task.interrupted
            - composition.started
            - composition.node_started
            - composition.node_completed
            - composition.node_cancelled
            - composition.completed
            - composition.cancelled
            - tool.requested
            - tool.approval_required
            - tool.approved
            - tool.rejected
            - agent_loop.turn_started
            - agent_loop.turn_completed
            - agent_loop.tool_requested
            - agent_loop.tool_executed
            - agent_loop.tool_failed
        state:
          $ref: '#/components/schemas/TaskState'
        configurationRevisionId:
          type: string
        attempt:
          type: integer
          minimum: 1
        data:
          type: object
          description: >-
            Bounded scalar event data. Composition events carry compositionDocumentId,
            compositionNodeId, nodeIndex, nodeCount, completedNodeCount, and terminalNodeIds
            as documented by ADR 0016. Public tool ledger events carry toolRequestId,
            configurationRevisionId, attempt, compositionDocumentId, compositionNodeId,
            toolName, argumentsDigest, idempotencyKey, status, and decision-only decision,
            approvalId, and reasonDigest fields as documented by ADR 0017. Execution,
            replay, denial, and failure vocabulary is not part of the public event contract.
          additionalProperties:
            type: [string, number, boolean, 'null']
        agentId:
          type: string
          pattern: '^agt_[a-f0-9]{32}$'
        agentRevisionId:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
        providerId:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,63}$'
        modelId:
          type: string
          minLength: 1
          maxLength: 300
    EventList:
      type: object
      additionalProperties: false
      required: [events, cursor]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeEvent'
        cursor:
          type: [string, 'null']
