          $ref: '#/components/responses/OrganizationUnavailableError'
  /v1/agent-chat/conversations/{conversationId}/events:
    get:
      operationId: streamAgentChatConversation
      summary: Stream projected Agent Chat updates over Server-Sent Events with resumable cursors.
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            pattern: '^chat_[0-9a-f]{24}$'
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: '^evt_[0-9]{12}$'
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            pattern: '^evt_[0-9]{12}$'
      responses:
        '200':
          description: Server-Sent Events. The first frame is a snapshot; later frames carry projected Agent Chat messages with the Runtime event id.
          content:
            text/event-stream:
              schema:
                type: string
                description: 'UTF-8 event-stream. Each `event: agent-chat` frame has a `data:` JSON payload matching AgentChatStreamFrame; `id:` carries the Runtime event id and is used for Last-Event-ID resume.'
        '400':
          $ref: '#/components/responses/OrganizationValidationError'
        '404':
          $ref: '#/components/responses/OrganizationNotFoundError'
        '503':
          $ref: '#/components/responses/OrganizationUnavailableError'
  /v1/execution/health:
    get:
      operationId: getExecutionHealth
      summary: Read controlled-execution contract availability and exact published paths.
      responses:
        '200':
          description: Controlled-execution contract availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionHealth'
        '503':
          $ref: '#/components/responses/ExecutionUnavailableError'
  /v1/execution/capabilities:
    get:
      operationId: listExecutionCapabilities
      summary: List published capability facts; recorded data never grants execution.
      responses:
        '200':
          description: Capability collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionCapabilityList'
        '503':
          $ref: '#/components/responses/ExecutionUnavailableError'
  /v1/execution/grants:
    get:
      operationId: listExecutionGrants
      summary: List explicit Runtime-owned execution grants.
      responses:
        '200':
          description: Grant collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionGrantList'
        '503':
          $ref: '#/components/responses/ExecutionUnavailableError'
    post:
      operationId: createExecutionGrant
      summary: Create one explicit grant bound to Agent, Delegation, WorkItem, policy, and operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExecutionGrantRequest'
      responses:
        '201':
          description: Grant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionGrantEnvelope'
        '400':
          $ref: '#/components/responses/ExecutionValidationError'
        '409':
          $ref: '#/components/responses/ExecutionConflictError'
        '503':
          $ref: '#/components/responses/ExecutionUnavailableError'
  /v1/execution/grants/{grantId}/revoke:
    post:
      operationId: revokeExecutionGrant
      summary: Revoke an active grant using its published expected version.
      parameters:
        - name: grantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionExpectedVersionRequest'
      responses:
        '200':
          description: Grant revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionGrantEnvelope'
        '400':
          $ref: '#/components/responses/ExecutionValidationError'
        '404':
          $ref: '#/components/responses/ExecutionNotFoundError'
        '409':
          $ref: '#/components/responses/ExecutionConflictError'
        '503':
          $ref: '#/components/responses/ExecutionUnavailableError'
  /v1/execution/requests:
    post:
      operationId: createExecutionRequest
      summary: Create a bounded pending execution request under an active grant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExecutionRequest'
      responses:
        '201':
          description: Execution request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRequestEnvelope'
        '400':
          $ref: '#/components/responses/ExecutionValidationError'
        '404':
          $ref: '#/components/responses/ExecutionNotFoundError'
        '409':
          $ref: '#/components/responses/ExecutionConflictError'
        '503':
          $ref: '#/components/responses/ExecutionUnavailableError'
  /v1/execution/requests/{requestId}:
    get:
      operationId: getExecutionRequest
      summary: Read one published execution request.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Execution request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRequestEnvelope'
        '404':
          $ref: '#/components/responses/ExecutionNotFoundError'
        '503':
          $ref: '#/components/responses/ExecutionUnavailableError'
  /v1/execution/requests/{requestId}/decide:
    post:
      operationId: decideExecutionRequest
      summary: Approve and fake-execute, or reject, a pending request using its published expected version.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideExecutionRequest'
      responses:
        '200':
          description: Decided execution request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRequestEnvelope'
        '400':
          $ref: '#/components/responses/ExecutionValidationError'
        '404':
          $ref: '#/components/responses/ExecutionNotFoundError'
        '409':
          $ref: '#/components/responses/ExecutionConflictError'
        '503':
          $ref: '#/components/responses/ExecutionUnavailableError'
  /v1/execution/events:
    get:
      operationId: listExecutionEvents
      summary: Read bounded deterministic execution audit events.
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: '^exe_[a-z0-9]+$'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Execution event page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionEventPage'
        '400':
          $ref: '#/components/responses/ExecutionValidationError'
        '503':
          $ref: '#/components/responses/ExecutionUnavailableError'
  /v1/execution/run-health:
    get:
      operationId: getExecutionRunHealth
      summary: Read isolated execution 1.3.0 availability and exact published run paths.
      responses:
        '200':
          description: Isolated execution run contract availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRunHealth'
        '503':
          $ref: '#/components/responses/ExecutionRunUnavailableError'
  /v1/execution/adapters:
    get:
      operationId: listExecutionAdapters
      summary: List published isolated local executor adapters.
      responses:
        '200':
          description: Adapter collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionAdapterList'
        '503':
          $ref: '#/components/responses/ExecutionRunUnavailableError'
  /v1/execution/runs:
    get:
      operationId: listExecutionRuns
      summary: List durable isolated execution runs.
      responses:
        '200':
          description: Run collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRunList'
        '503':
          $ref: '#/components/responses/ExecutionRunUnavailableError'
    post:
      operationId: createExecutionRun
      summary: Create a queued run from an approved request and active grant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExecutionRunRequest'
      responses:
        '201':
          description: Run created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRunEnvelope'
        '400':
          $ref: '#/components/responses/ExecutionRunValidationError'
        '404':
          $ref: '#/components/responses/ExecutionRunNotFoundError'
        '409':
          $ref: '#/components/responses/ExecutionRunConflictError'
        '503':
          $ref: '#/components/responses/ExecutionRunUnavailableError'
  /v1/execution/runs/{runId}:
    get:
      operationId: getExecutionRun
      summary: Read one durable execution run.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Execution run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRunEnvelope'
        '404':
          $ref: '#/components/responses/ExecutionRunNotFoundError'
        '503':
          $ref: '#/components/responses/ExecutionRunUnavailableError'
  /v1/execution/runs/{runId}/start:
    post:
      operationId: startExecutionRun
      summary: Start a queued run in an isolated local child process.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRunTransitionRequest'
      responses:
        '200':
          description: Finished execution run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRunEnvelope'
        '400':
          $ref: '#/components/responses/ExecutionRunValidationError'
        '404':
          $ref: '#/components/responses/ExecutionRunNotFoundError'
        '409':
          $ref: '#/components/responses/ExecutionRunConflictError'
        '503':
          $ref: '#/components/responses/ExecutionRunUnavailableError'
  /v1/execution/runs/{runId}/cancel:
    post:
      operationId: cancelExecutionRun
      summary: Cancel a queued run using its published expected version.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRunTransitionRequest'
      responses:
        '200':
          description: Cancelled execution run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRunEnvelope'
        '400':
          $ref: '#/components/responses/ExecutionRunValidationError'
        '409':
          $ref: '#/components/responses/ExecutionRunConflictError'
  /v1/execution/runs/{runId}/recover:
    post:
      operationId: recoverExecutionRun
      summary: Recover an interrupted or failed run for a fresh bounded attempt.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRunTransitionRequest'
      responses:
        '200':
          description: Recovered queued execution run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRunEnvelope'
        '400':
          $ref: '#/components/responses/ExecutionRunValidationError'
        '409':
          $ref: '#/components/responses/ExecutionRunConflictError'
  /v1/execution/runs/{runId}/events:
    get:
      operationId: listExecutionRunEvents
      summary: Read bounded audit events for one run.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: after
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Run event page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRunEventPage'
        '400':
          $ref: '#/components/responses/ExecutionRunValidationError'
        '404':
          $ref: '#/components/responses/ExecutionRunNotFoundError'

components:
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        pattern: '^agt_[a-f0-9]{32}$'
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^cfg_[0-9a-f]{24}$'
    ToolRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        pattern: '^tqr_[0-9a-f]{24}$'
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        type: string
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
    PairingId:
      name: pairingId
      in: path
      required: true
      schema:
        type: string
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
    HandleId:
      name: handleId
      in: path
      required: true
      schema:
        type: string
    WorkItemId:
      name: workItemId
      in: path
      required: true
      schema:
        type: string
        pattern: '^work_[0-9a-f]{24}$'
    OrganizationProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: '^project_[a-z0-9_-]+$'
    OrganizationProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        pattern: '^wrk_[a-z0-9_-]+$'
    OrganizationDelegationId:
      name: delegationId
      in: path
      required: true
      schema:
        type: string
        pattern: '^del_[a-z0-9_-]+$'
    OrganizationWorkItemId:
      name: workItemId
      in: path
      required: true
      schema:
        type: string
        pattern: '^work_[a-z0-9_-]+$'
    OrganizationReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        pattern: '^rpt_[a-z0-9_-]+$'
    OrganizationAttentionId:
      name: attentionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^att_[a-z0-9_-]+$'
    AgentReference:
      type: object
      additionalProperties: false
      required: [providerId, modelId]
      properties:
        providerId:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,63}$'
        modelId:
          type: string
          minLength: 1
          maxLength: 300
    AgentProfile:
      type: object
      additionalProperties: false
      required: [name, instructions, providerId, modelId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        instructions:
          type: string
          maxLength: 20000
          description: Untrusted customization context; never grants tools or permissions.
        providerId:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,63}$'
        modelId:
          type: string
          minLength: 1
          maxLength: 300
    AgentRevision:
      type: object
      additionalProperties: false
      required: [id, name, instructions, providerId, modelId, createdAt]
      properties:
        id:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
        name:
          type: string
          minLength: 1
          maxLength: 120
        instructions:
          type: string
          maxLength: 20000
          description: Untrusted customization context; never grants tools or permissions.
        providerId:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,63}$'
        modelId:
          type: string
          minLength: 1
          maxLength: 300
        createdAt:
          type: string
          format: date-time
    AgentRecord:
      type: object
      additionalProperties: false
      required: [id, currentRevisionId, archived, isDefault, current]
      properties:
        id:
          type: string
          pattern: '^agt_[a-f0-9]{32}$'
        currentRevisionId:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
        archived:
          type: boolean
        isDefault:
          type: boolean
        current:
          $ref: '#/components/schemas/AgentRevision'
    Agent:
      type: object
      additionalProperties: false
      required: [id, currentRevisionId, archived, isDefault, current, revisions]
      properties:
        id:
          type: string
          pattern: '^agt_[a-f0-9]{32}$'
        currentRevisionId:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
        archived:
          type: boolean
        isDefault:
          type: boolean
        current:
          $ref: '#/components/schemas/AgentRevision'
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/AgentRevision'
    AgentEnvelope:
      type: object
      additionalProperties: false
      required: [agent]
      properties:
        agent:
          $ref: '#/components/schemas/Agent'
    AgentRecordEnvelope:
      type: object
      additionalProperties: false
      required: [agent]
      properties:
        agent:
          $ref: '#/components/schemas/AgentRecord'
    AgentList:
      type: object
      additionalProperties: false
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentRecord'
    AgentRevisionList:
      type: object
      additionalProperties: false
      required: [agentId, revisions]
      properties:
        agentId:
          type: string
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/AgentRevision'
    AgentProfileEnvelope:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile:
          $ref: '#/components/schemas/AgentProfile'
    UpdateAgentRequest:
      type: object
      additionalProperties: false
      required: [expectedRevisionId, profile]
      properties:
        expectedRevisionId:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
        profile:
          $ref: '#/components/schemas/AgentProfile'
    DuplicateAgentRequest:
      type: object
      additionalProperties: false
      properties:
        revisionId:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
        profile:
          $ref: '#/components/schemas/AgentProfile'
    ApplyAgentRevisionRequest:
      type: object
      additionalProperties: false
      required: [revisionId, expectedRevisionId]
      properties:
        revisionId:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
        expectedRevisionId:
          type: string
          pattern: '^agr_[a-f0-9]{32}$'
    SetDefaultAgentRequest:
      type: object
      additionalProperties: false
      required: [agentId]
      properties:
        agentId:
          type: [string, 'null']
    DefaultAgentEnvelope:
      type: object
      additionalProperties: false
      required: [agent]
      properties:
        agent:
          oneOf:
            - $ref: '#/components/schemas/AgentRecord'
            - type: 'null'
    ProviderModel:
      type: object
      additionalProperties: false
      required: [providerId, modelId, reference, displayName, capabilities]
      properties:
        providerId:
          type: string
        modelId:
          type: string
        reference:
          type: string
        displayName:
          type: string
        capabilities:
          type: array
          items:
            type: string
    ProviderModelList:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ProviderModel'
  responses:
    ExecutionRunValidationError:
      description: Invalid run request, unknown field, or unsupported contract shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ExecutionRunNotFoundError:
      description: Execution run resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ExecutionRunConflictError:
      description: Execution run state, version, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ExecutionRunUnavailableError:
      description: Isolated execution service is not configured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ExecutionValidationError:
      description: Invalid execution request, unknown field, or unsupported contract shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ExecutionNotFoundError:
      description: Execution resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ExecutionConflictError:
      description: Execution state, version, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ExecutionUnavailableError:
      description: Controlled execution service is not configured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PlatformValidationError:
      description: Invalid JSON, unknown field, or unsupported contract shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PlatformNotFoundError:
      description: Platform resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PlatformConflictError:
      description: State, digest, identity, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PlatformUnavailableError:
      description: Platform store is not configured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrganizationValidationError:
      description: Invalid organization intent, decision, cursor, limit, or unsupported contract shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrganizationNotFoundError:
      description: Published organization resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrganizationConflictError:
      description: Organization sequence, idempotency, or state conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrganizationUnavailableError:
      description: Organization runtime store is not configured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, apiVersion]
      properties:
        status:
          const: ok
        service:
          const: conchbase
        apiVersion:
          const: 1
    RuntimeStatus:
      type: object
      additionalProperties: false
      required: [name, version, state, capabilities]
      properties:
        name:
          const: Conchbase
        version:
          type: string
        state:
          const: ready
        capabilities:
          type: array
          description: Runtime features currently available, including agents and provider-neutral-model-catalog when task services are enabled.
          items:
            type: string
        organizationContract:
          $ref: '#/components/schemas/OrganizationVersion'
        organizationPaths:
          const: 18
        executionContract:
          type: string
          const: '1.2.0'
        executionPaths:
          const: 8
        executionRunContract:
          type: string
          const: '1.3.0'
        executionRunPaths:
          const: 8
        conversationContract:
          type: string
          const: '1.4.0'
        conversationPaths:
          const: 2
        agentChatContract:
          type: string
          const: '1.8.0'
        agentChatPaths:
          const: 6
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    ValidationError:
      type: object
      additionalProperties: false
      required: [error, details]
      properties:
        error:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [path, reason]
      properties:
        path:
          type: string
        reason:
          type: string
    ConfigurationSource:
      type: string
      enum: [inline, file, registry, env]
    ConfigurationReference:
      type: object
      additionalProperties: false
      required: [id, label, source]
      properties:
        id:
          type: string
          maxLength: 128
        label:
          type: string
          maxLength: 200
        source:
          $ref: '#/components/schemas/ConfigurationSource'
    ConfigurationReferenceList:
      type: array
      maxItems: 32
      items:
        $ref: '#/components/schemas/ConfigurationReference'
    ConfigurationDocument:
      oneOf:
        - $ref: '#/components/schemas/ConfigurationDocumentV1'
        - $ref: '#/components/schemas/ConfigurationDocumentV2'
    ConfigurationDocumentV1:
      type: object
      additionalProperties: false
