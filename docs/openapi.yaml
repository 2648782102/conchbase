openapi: 3.1.0
info:
  title: Conchbase Runtime API
  version: 0.5.0
  description: Local, versioned API for Conchbase streaming model tasks, bounded composition execution, ordered progress events, Magpie model discovery, and versioned configuration revisions.
servers:
  - url: http://127.0.0.1:4318
    description: Local runtime default; loopback only.
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Check whether the local runtime process responds.
      responses:
        '200':
          description: Runtime process is responding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/runtime:
    get:
      operationId: getRuntimeStatus
      summary: Read runtime identity and currently advertised capabilities.
      responses:
        '200':
          description: Runtime status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
  /v1/models:
    get:
      operationId: listModels
      summary: List chat model ids exposed by the configured local Magpie gateway.
      responses:
        '200':
          description: Available models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '502':
          description: Model catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tasks:
    get:
      operationId: listTasks
      summary: List persisted tasks and the active configuration revision.
      responses:
        '200':
          description: Persisted tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
    post:
      operationId: createTask
      summary: Create and start one bounded model task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '202':
          description: Task accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tasks/{taskId}:
    get:
      operationId: getTask
      summary: Read one persisted task.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tasks/{taskId}/cancel:
    post:
      operationId: cancelTask
      summary: Request cancellation of an active task.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Task is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tasks/{taskId}/retry:
    post:
      operationId: retryTask
      summary: Start a new attempt for a terminal task from its original prompt.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: New attempt started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryTaskResponse'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Task is not in a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/events:
    get:
      operationId: listEvents
      summary: Read globally ordered persisted events after an optional event ID cursor.
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: '^evt_[0-9]{12}$'
      responses:
        '200':
          description: Events strictly after the cursor and the resulting cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          description: Invalid or unknown event cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/configuration:
    get:
      operationId: getActiveConfiguration
      summary: Read the active immutable configuration revision and document.
      responses:
        '200':
          description: Active configuration revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationEnvelope'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/configuration/revisions:
    get:
      operationId: listConfigurationRevisions
      summary: List immutable configuration revision summaries, newest first.
      responses:
        '200':
          description: Configuration history and active revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationRevisionList'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/configuration/revisions/{revisionId}:
    get:
      operationId: getConfigurationRevision
      summary: Read one immutable configuration revision document.
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Configuration revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationEnvelope'
        '404':
          description: Configuration revision not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/configuration/validate:
    post:
      operationId: validateConfiguration
      summary: Validate a configuration document without changing runtime state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateConfigurationRequest'
      responses:
        '200':
          description: Document is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateConfigurationResponse'
        '400':
          description: Invalid document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/configuration/apply:
    post:
      operationId: applyConfiguration
      summary: Apply a complete document or roll back to a known revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyConfigurationRequest'
      responses:
        '200':
          description: Configuration state after the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyConfigurationResponse'
        '400':
          description: Invalid document or request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Rollback revision not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Task service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^cfg_[0-9a-f]{24}$'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, apiVersion]
      properties:
        status:
          const: ok
        service:
          const: conchbase
        apiVersion:
          const: 1
    RuntimeStatus:
      type: object
      additionalProperties: false
      required: [name, version, state, capabilities]
      properties:
        name:
          const: Conchbase
        version:
          type: string
        state:
          const: ready
        capabilities:
          type: array
          items:
            type: string
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    ValidationError:
      type: object
      additionalProperties: false
      required: [error, details]
      properties:
        error:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [path, reason]
      properties:
        path:
          type: string
        reason:
          type: string
    ConfigurationSource:
      type: string
      enum: [inline, file, registry, env]
    ConfigurationReference:
      type: object
      additionalProperties: false
      required: [id, label, source]
      properties:
        id:
          type: string
          maxLength: 128
        label:
          type: string
          maxLength: 200
        source:
          $ref: '#/components/schemas/ConfigurationSource'
    ConfigurationReferenceList:
      type: array
      maxItems: 32
      items:
        $ref: '#/components/schemas/ConfigurationReference'
    ConfigurationDocument:
      oneOf:
        - $ref: '#/components/schemas/ConfigurationDocumentV1'
        - $ref: '#/components/schemas/ConfigurationDocumentV2'
    ConfigurationDocumentV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, name, skills, policies, mcpServers, plugins, secretRefs, metadata]
      properties:
        schemaVersion:
          const: 1
        name:
          $ref: '#/components/schemas/BoundedConfigurationName'
        skills:
          $ref: '#/components/schemas/ConfigurationReferenceList'
        policies:
          $ref: '#/components/schemas/ConfigurationReferenceList'
        mcpServers:
          $ref: '#/components/schemas/ConfigurationReferenceList'
        plugins:
          $ref: '#/components/schemas/ConfigurationReferenceList'
        secretRefs:
          $ref: '#/components/schemas/ConfigurationSecretRefs'
        metadata:
          $ref: '#/components/schemas/ConfigurationMetadata'
    ConfigurationDocumentV2:
      type: object
      additionalProperties: false
      required: [schemaVersion, name, skills, policies, mcpServers, plugins, secretRefs, metadata, composition]
      properties:
        schemaVersion:
          const: 2
        name:
          $ref: '#/components/schemas/BoundedConfigurationName'
        skills:
          $ref: '#/components/schemas/ConfigurationReferenceList'
        policies:
          $ref: '#/components/schemas/ConfigurationReferenceList'
        mcpServers:
          $ref: '#/components/schemas/ConfigurationReferenceList'
        plugins:
          $ref: '#/components/schemas/ConfigurationReferenceList'
        secretRefs:
          $ref: '#/components/schemas/ConfigurationSecretRefs'
        metadata:
          $ref: '#/components/schemas/ConfigurationMetadata'
        composition:
          $ref: '#/components/schemas/ConfigurationComposition'
    BoundedConfigurationName:
      type: string
      minLength: 1
      maxLength: 120
    ConfigurationSecretRefs:
      type: array
      maxItems: 32
      items:
        type: string
        maxLength: 200
    ConfigurationMetadata:
      type: object
      maxProperties: 32
      additionalProperties:
        type: string
        maxLength: 500
    ConfigurationComposition:
      type: object
      additionalProperties: false
      required: [schemaVersion, name, nodes, links, entryNodeIds, metadata]
      properties:
        schemaVersion:
          const: 1
        name:
          $ref: '#/components/schemas/BoundedConfigurationName'
        nodes:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/CompositionNode'
        links:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/CompositionLink'
        entryNodeIds:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/CompositionNodeId'
        metadata:
          $ref: '#/components/schemas/ConfigurationMetadata'
    CompositionNode:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          $ref: '#/components/schemas/CompositionNodeId'
        label:
          type: string
          minLength: 1
          maxLength: 200
    CompositionLink:
      type: object
      additionalProperties: false
      required: [id, from, to, label]
      properties:
        id:
          $ref: '#/components/schemas/CompositionNodeId'
        from:
          $ref: '#/components/schemas/CompositionNodeId'
        to:
          $ref: '#/components/schemas/CompositionNodeId'
        label:
          type: string
          minLength: 1
          maxLength: 200
    CompositionNodeId:
      type: string
      minLength: 1
      maxLength: 128
    ConfigurationRevision:
      type: object
      additionalProperties: false
      required: [id, document, appliedAt]
      properties:
        id:
          type: string
          pattern: '^cfg_[0-9a-f]{24}$'
        document:
          $ref: '#/components/schemas/ConfigurationDocument'
        appliedAt:
          type: string
          format: date-time
    ConfigurationRevisionSummary:
      type: object
      additionalProperties: false
      required: [id, name, appliedAt]
      properties:
        id:
          type: string
        name:
          type: string
        appliedAt:
          type: string
          format: date-time
    ConfigurationEnvelope:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          $ref: '#/components/schemas/ConfigurationRevision'
    ConfigurationRevisionList:
      type: object
      additionalProperties: false
      required: [activeRevisionId, revisions]
      properties:
        activeRevisionId:
          type: string
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationRevisionSummary'
    ValidateConfigurationRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document:
          $ref: '#/components/schemas/ConfigurationDocument'
    ValidateConfigurationResponse:
      type: object
      additionalProperties: false
      required: [valid, activeRevisionId, document]
      properties:
        valid:
          const: true
        activeRevisionId:
          type: string
        document:
          $ref: '#/components/schemas/ConfigurationDocument'
    ApplyConfigurationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      oneOf:
        - required: [document]
          not:
            required: [rollbackTo]
        - required: [rollbackTo]
          not:
            required: [document]
      properties:
        document:
          $ref: '#/components/schemas/ConfigurationDocument'
        rollbackTo:
          type: string
          pattern: '^cfg_[0-9a-f]{24}$'
    ApplyConfigurationResponse:
      type: object
      additionalProperties: false
      required: [changed, activeRevisionId, revision, revisions]
      properties:
        changed:
          type: boolean
        activeRevisionId:
          type: string
        revision:
          $ref: '#/components/schemas/ConfigurationRevision'
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationRevisionSummary'
    TaskState:
      type: string
      enum: [queued, running, cancelling, succeeded, failed, cancelled, interrupted, waiting_approval]
    Task:
      type: object
      additionalProperties: false
      required: [id, prompt, model, configurationRevisionId, state, attempt, output, partialOutput, error]
      properties:
        id:
          type: string
        prompt:
          type: string
        model:
          type: string
        configurationRevisionId:
          type: string
        state:
          $ref: '#/components/schemas/TaskState'
        attempt:
          type: integer
          minimum: 1
        output:
          type: [string, 'null']
        partialOutput:
          type: [string, 'null']
        error:
          type: [string, 'null']
    TaskEnvelope:
      type: object
      additionalProperties: false
      required: [task]
      properties:
        task:
          $ref: '#/components/schemas/Task'
    TaskList:
      type: object
      additionalProperties: false
      required: [tasks, activeConfigurationRevisionId]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        activeConfigurationRevisionId:
          type: string
    RetryTaskResponse:
      type: object
      additionalProperties: false
      required: [task, retried]
      properties:
        task:
          $ref: '#/components/schemas/Task'
        retried:
          const: true
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
        model:
          type: string
          minLength: 1
          maxLength: 300
    RuntimeEvent:
      type: object
      additionalProperties: false
      required: [sequence, id, taskId, type, state, configurationRevisionId, attempt, data]
      properties:
        sequence:
          type: integer
          minimum: 1
        id:
          type: string
        taskId:
          type: string
        type:
          type: string
        state:
          $ref: '#/components/schemas/TaskState'
        configurationRevisionId:
          type: string
        attempt:
          type: integer
          minimum: 1
        data:
          type: object
          description: >-
            Bounded scalar event data. Composition events carry compositionDocumentId,
            compositionNodeId, nodeIndex, nodeCount, completedNodeCount, and terminalNodeIds
            as documented by ADR 0016.
          additionalProperties:
            type: [string, number, boolean, 'null']
    EventList:
      type: object
      additionalProperties: false
      required: [events, cursor]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeEvent'
        cursor:
          type: [string, 'null']
    ModelCatalogEntry:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
        displayName:
          type: string
    ModelList:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelCatalogEntry'
