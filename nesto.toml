# Parallel development for the Conchbase Runtime and the Pagurus console.
#
# Two independent Git repositories cooperate on one product: Conchbase owns
# execution and state, Pagurus is a client of its published API. They are
# separate remotes with separate histories, so each is declared once here and
# integrated separately.
#
# `base` is a committed local ref. `origin/main` is used because the local
# `main` branch of the Pagurus checkout is held by another worktree and cannot
# be checked out here.
#
# IMPORTANT: every session must load this file from the MAIN checkout
# (Conchbase/nesto.toml). The Nesto project id is derived from the manifest's
# own directory, so running this worktree's copy produces a separate ledger
# that cannot see or block the other session. This copy exists only so the
# setting is versioned alongside the code.
version = 1

[[repositories]]
id = "runtime"
path = "."
base = "origin/main"

# A nested repository: must be ignored by the parent (it is, via
# .git/info/exclude) and must not be a submodule.
[[repositories]]
id = "console"
path = "pagurus"
base = "origin/main"

# A module's lease covers the literal directory prefix of its patterns: for
# `src/runtime/agent-chat*.ts` that prefix is the whole of `src/runtime`, so two
# different modules in one directory block each other. Keep modules in distinct
# directories, and use `claim --path` for a single file.
[modules.runtime]
agent-chat = ["src/runtime/agent-chat.ts", "src/runtime/agent-chat-output.ts", "src/runtime/agent-chat-projection.ts", "src/runtime/agent-chat-state.ts", "src/runtime/agent-chat-store.ts", "src/runtime/agent-chat-types.ts"]
organization = ["src/runtime/organization-action-contract.ts", "src/runtime/organization-agent-projection.ts", "src/runtime/organization-contract.ts", "src/runtime/organization-contract-http.ts", "src/runtime/organization-convergence.ts", "src/runtime/organization-convergence-runtime.ts", "src/runtime/organization-coordinator.ts", "src/runtime/organization-execution.ts", "src/runtime/organization-intent-input.ts", "src/runtime/organization-store.ts", "src/runtime/boss-memory.ts", "src/runtime/boss-mode-service.ts", "src/runtime/boss-organization-context.ts"]
tasks = ["src/runtime/task-service.ts", "src/runtime/task-store.ts", "src/runtime/task-store-migrations.ts", "src/runtime/task-store-rows.ts", "src/runtime/task-runner.ts", "src/runtime/task-lifecycle.ts", "src/runtime/task-capabilities.ts", "src/runtime/tool-provider.ts", "src/runtime/tool-request.ts", "src/runtime/tool-runtime.ts", "src/runtime/tool-gate.ts", "src/runtime/tool-arguments.ts", "src/runtime/tool-result-paging.ts", "src/runtime/tool-capability.ts"]
runtime-git = ["src/runtime/git-tools.ts"]
http-routes = ["src/http/routes/**", "src/http/create-app.ts", "src/http/auth.ts"]
agent-memory = ["src/runtime/agent-memory.ts", "src/runtime/memory-review.ts"]

# Module globs are matched against paths relative to each repository's own root,
# not against the parent project. A nested repository must therefore not repeat
# its own directory prefix.
[modules.console]
agent-app = ["src/agent/**"]
# Kept off `src/shared/api`: that directory's literal prefix is the whole of
# `src/shared/api`, so listing a file there would collide with `api-clients`.
agent-chat-client = ["src/features/agent-chat/**"]
console-shell = ["src/app/**", "src/styles/**"]
api-clients = ["src/shared/api/**"]
console-features = ["src/features/agents/**", "src/features/capabilities/**", "src/features/configuration/**", "src/features/execution/**", "src/features/organization/**", "src/features/runtime-status/**", "src/features/secrets/**", "src/features/task-history/**", "src/features/task-operations/**", "src/features/work/**"]
shared-ui = ["src/shared/ui/**"]

# The commands below run with this user's local privileges during integration.
# They mirror CI: typecheck/check, the full suite, then a production build.
#
# Each gate runs with its own repository root as the working directory, so a
# nested repository needs no `cd`. Each installs dependencies first: integration
# runs in a fresh candidate tree created by `git worktree`, which never has
# node_modules; without the install the gate fails with "tsc: command not found".
# node_modules is git-ignored, so installing does not trip the "test modified
# the worktree" check that runs after every gate.
[tests]
runtime = "npm ci --ignore-scripts --no-audit --no-fund && npm run check && npm test && npm run build"
console = "npm ci --ignore-scripts --no-audit --no-fund && npm run check && npm test && npm run build"
